services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: remote_n3
      POSTGRES_USER: remote_n3
      POSTGRES_PASSWORD: remote_n3
    ports:
      - "5432:5432"
    volumes:
      - remote_n3_postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - remote_n3_redis:/data

  coturn:
    image: coturn/coturn:4.6.3
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --realm=${TURN_REALM:-remote-n3.local}
      - --user=${TURN_USER:-remote-n3}:${TURN_PASSWORD:-change-me}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200

volumes:
  remote_n3_postgres:
  remote_n3_redis:
